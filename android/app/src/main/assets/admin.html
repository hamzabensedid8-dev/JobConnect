<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JobConnect Admin</title>
<style>
:root{--navy:#0b1b49;--blue:#145cf5;--line:#e3eaf8;--muted:#64718b;--pale:#f4f7ff;--green:#12815d;--red:#e5484d;--bg:#f7f9fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--navy);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font-size:15px}
.hidden{display:none!important}
button{font:inherit}

/* ---------- login ---------- */
#login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:20px;padding:26px 22px;width:min(430px,100%);box-shadow:0 18px 50px #0b1b4920}
.mark{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
h1{font-size:22px;margin:14px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;font-size:12px;font-weight:700;color:#344364;margin:10px 0 6px}
input,select,textarea{width:100%;border:1px solid #dfe6f3;border-radius:11px;padding:13px;font-size:15px;outline:0;background:#fff;color:var(--navy)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #145cf51a}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;margin-top:16px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line);font-weight:700}
.btn.sm{width:auto;padding:8px 12px;font-size:12px;margin:0;border-radius:9px}
.err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

/* ---------- shell ---------- */
#app{display:none;flex-direction:column;height:100%}
.appbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar b{font-size:15px}
.appbar small{display:block;color:#a9bbe0;font-size:11px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-width:88px;border:0;background:none;padding:13px 8px;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.view{display:none}
.view.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:20px;background:#eaf0ff;color:var(--blue);white-space:nowrap}
.pill.green{background:#e7f6ef;color:var(--green)}
.pill.red{background:#fdeaea;color:var(--red)}
.pill.grey{background:#eef1f7;color:#5b6884}
.muted{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:25px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;color:#3c4b6b}
.chip.danger{color:var(--red);border-color:#f6c9ca}
.chip.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}

/* ---------- chat ---------- */
.conv{display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:last-child{border:0}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:linear-gradient(135deg,#145cf5,#6f9bff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.conv-body{flex:1;min-width:0}
.conv-body b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-body small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.unread{background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:800;padding:2px 7px}
#chatView{position:fixed;inset:0;background:#eaf0fa;display:none;flex-direction:column;z-index:20;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#chatView.on{display:flex}
.chat-top{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.chat-top b{font-size:14px;display:block}
.chat-top small{font-size:11px;color:#a9bbe0}
.chat-top button{background:none;border:0;color:#fff;font-size:20px;padding:0 6px}
.chat-top .del{font-size:12px;font-weight:700;border:1px solid #ffffff44;border-radius:8px;padding:7px 9px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;background:#fff;font-size:13.5px;line-height:1.45;position:relative;word-break:break-word;box-shadow:0 1px 2px #0b1b4910}
.msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.theirs{align-self:flex-start;border-bottom-left-radius:5px}
.msg .meta{font-size:9px;opacity:.7;display:block;text-align:right;margin-top:3px}
.msg .delmsg{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;border-radius:22px;padding:12px 16px}
.composer button{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <div class="mark">JC</div>
    <h1>Admin console</h1>
    <p class="sub">This console lives inside the application only.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@jobconnect.example" required>
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</section>

<div id="app">
  <div class="appbar">
    <div><b>JobConnect Admin</b><small id="whoami">—</small></div>
    <button class="chip danger" id="logout">Log out</button>
  </div>

  <nav class="tabs">
    <button class="on" data-view="overview">Overview</button>
    <button data-view="requests">Requests</button>
    <button data-view="jobs">Jobs</button>
    <button data-view="chats">Chats</button>
    <button data-view="notifs">Alerts</button>
  </nav>

  <main>
    <div class="view on" id="view-overview">
      <div class="grid" id="stats"></div>
      <h3>Latest requests</h3>
      <div id="latest"></div>
    </div>

    <div class="view" id="view-requests">
      <div class="row" style="margin-bottom:10px">
        <span class="muted" id="reqCount"></span>
        <select id="reqFilter" style="width:auto;padding:9px;font-size:12px">
          <option value="">All statuses</option>
          <option value="received">Received</option>
          <option value="under_review">Under review</option>
          <option value="shortlisted">Shortlisted</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div id="reqList"></div>
    </div>

    <div class="view" id="view-jobs"><div id="jobList"></div></div>

    <div class="view" id="view-chats">
      <div class="card" id="convList" style="padding:0"></div>
    </div>

    <div class="view" id="view-notifs"><div id="notifList"></div></div>
  </main>
</div>

<div id="chatView">
  <div class="chat-top">
    <button id="chatBack">‹</button>
    <div style="flex:1"><b id="chatPeer">—</b><small id="chatSub"></small></div>
    <button class="del" id="chatDelete">Delete chat</button>
  </div>
  <div class="msgs" id="chatMsgs"></div>
  <form class="composer" id="chatForm">
    <input id="chatInput" placeholder="Message…" autocomplete="off">
    <button type="submit">➤</button>
  </form>
</div>

<script>
/* ------------------------------------------------------------------ setup */
var API = (window.JCAndroid && JCAndroid.apiBase && JCAndroid.apiBase()) || "";
var CLIENT_KEY = (window.JCAndroid && JCAndroid.clientKey && JCAndroid.clientKey()) || "";
var TOKEN = "";
var state = { convs: [], active: null, msgs: [], lastId: 0, timer: null };

function toast(msg){
  var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},2600);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function timeOf(iso){var d=new Date(iso);if(isNaN(d))return"";
  return d.toLocaleDateString([], {day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join("");}

async function api(path, opts){
  opts = opts || {};
  var headers = { "Content-Type": "application/json" };
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  if (CLIENT_KEY) headers["x-jc-client-key"] = CLIENT_KEY;
  var res = await fetch(API + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ("Error " + res.status));
  return data;
}

/* ------------------------------------------------------------------ login */
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var err = document.getElementById("loginErr");
  err.textContent = "";
  try {
    if (!CLIENT_KEY) throw new Error("This build is missing its client key. Rebuild the APK with ADMIN_CLIENT_KEY.");
    var d = await api("/api/auth/login", { method: "POST", body: {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }});
    if (d.user.role !== "admin") throw new Error("This account is not an administrator.");
    TOKEN = d.token;
    if (window.JCAndroid) JCAndroid.saveSession(d.token, d.user.role, d.user.name);
    enter(d.user);
  } catch (ex) { err.textContent = ex.message; }
});

function enter(user){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").style.display = "flex";
  document.getElementById("whoami").textContent = user.email;
  loadOverview();
  loadRequests();
  loadJobs();
  loadConvs();
  loadNotifs();
}

document.getElementById("logout").onclick = function(){
  TOKEN = "";
  if (window.JCAndroid) JCAndroid.clearSession();
  location.reload();
};

/* ------------------------------------------------------------------ tabs */
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("on");});
    document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on");});
    b.classList.add("on");
    document.getElementById("view-" + b.dataset.view).classList.add("on");
  };
});

/* -------------------------------------------------------------- overview */
async function loadOverview(){
  try{
    var d = await api("/api/admin/overview");
    var sum = function(arr){return (arr||[]).reduce(function(s,x){return s + x.count;},0);};
    var cards = [
      ["Accounts", sum(d.users)],
      ["Requests", sum(d.applications)],
      ["Job posts", sum(d.jobs)],
      ["Pending jobs", (d.jobs||[]).filter(function(j){return j.status==="pending";}).reduce(function(s,x){return s+x.count;},0)]
    ];
    document.getElementById("stats").innerHTML = cards.map(function(c){
      return '<div class="stat"><b>'+c[1]+'</b><span>'+c[0]+'</span></div>';
    }).join("");
    document.getElementById("latest").innerHTML = (d.latestApplications||[]).slice(0,10).map(function(a){
      return '<div class="card"><div class="row"><b>'+esc(a.full_name)+'</b>'+
        '<span class="pill">'+esc(a.status)+'</span></div>'+
        '<p class="muted" style="margin:6px 0 0">'+esc(a.profession)+' → '+esc(a.target_country)+' · '+esc(a.reference)+'</p></div>';
    }).join("") || '<p class="empty">No requests yet.</p>';
  }catch(e){ toast(e.message); }
}

/* -------------------------------------------------------------- requests */
var requestsCache = [];
async function loadRequests(){
  try{
    var d = await api("/api/admin/applications");
    requestsCache = d.applications || [];
    renderRequests();
  }catch(e){ toast(e.message); }
}
function renderRequests(){
  var filter = document.getElementById("reqFilter").value;
  var rows = requestsCache.filter(function(a){ return !filter || a.status === filter; });
  document.getElementById("reqCount").textContent = rows.length + " request(s)";
  document.getElementById("reqList").innerHTML = rows.map(function(a){
    return '<div class="card" data-ref="'+esc(a.reference)+'">'+
      '<div class="row"><b>'+esc(a.full_name)+'</b><span class="pill'+(a.status==="approved"?" green":a.status==="rejected"?" red":"")+'">'+esc(a.status)+'</span></div>'+
      '<p class="muted" style="margin:6px 0">'+esc(a.profession)+' → '+esc(a.target_country)+'<br>'+esc(a.email)+
      (a.phone?' · '+esc(a.phone):'')+'</p>'+
      '<p class="muted" style="margin:0;font-size:11px">'+esc(a.reference)+' · '+timeOf(a.created_at)+'</p>'+
      '<div class="actions">'+
        ['under_review','shortlisted','approved','rejected','completed'].map(function(s){
          return '<button class="chip'+(a.status===s?" primary":"")+'" data-set="'+s+'">'+s.replace("_"," ")+'</button>';
        }).join("")+
      '</div></div>';
  }).join("") || '<p class="empty">No requests.</p>';
}
document.getElementById("reqFilter").onchange = renderRequests;
document.getElementById("reqList").addEventListener("click", async function(e){
  var btn = e.target.closest("[data-set]");
  if (!btn) return;
  var card = btn.closest("[data-ref]");
  var note = prompt("Message for the candidate (optional)", "");
  if (note === null) return;
  try{
    await api("/api/admin/applications/" + encodeURIComponent(card.dataset.ref), {
      method: "PATCH", body: { status: btn.dataset.set, admin_note: note }
    });
    toast("Request updated.");
    loadRequests(); loadOverview();
  }catch(ex){ toast(ex.message); }
});

/* ------------------------------------------------------------------ jobs */
async function loadJobs(){
  try{
    var d = await api("/api/recruiter/jobs");
    document.getElementById("jobList").innerHTML = (d.jobs||[]).map(function(j){
      return '<div class="card"><div class="row"><b>'+esc(j.title)+'</b>'+
        '<span class="pill'+(j.status==="published"?" green":j.status==="pending"?" grey":" red")+'">'+esc(j.status)+'</span></div>'+
        '<p class="muted" style="margin:6px 0">'+esc(j.company)+' · '+esc(j.country)+'</p>'+
        '<div class="actions">'+
        (j.status==="pending"?'<button class="chip primary" data-job="'+j.id+'" data-status="published">Publish</button>':'')+
        (j.status!=="closed"?'<button class="chip" data-job="'+j.id+'" data-status="closed">Close</button>':'')+
        (j.status!=="rejected"?'<button class="chip danger" data-job="'+j.id+'" data-status="rejected">Reject</button>':'')+
        '</div></div>';
    }).join("") || '<p class="empty">No job posts.</p>';
  }catch(e){ toast(e.message); }
}
document.getElementById("jobList").addEventListener("click", async function(e){
  var b = e.target.closest("[data-job]");
  if (!b) return;
  try{
    await api("/api/admin/jobs/" + b.dataset.job, { method:"PATCH", body:{ status: b.dataset.status }});
    toast("Job updated."); loadJobs(); loadOverview();
  }catch(ex){ toast(ex.message); }
});

/* ----------------------------------------------------------------- chats */
async function loadConvs(){
  try{
    var d = await api("/api/chat/conversations");
    state.convs = d.conversations || [];
    document.getElementById("convList").innerHTML = state.convs.map(function(c){
      var name;
      if (c.kind === "admin_candidate") name = (c.candidate ? c.candidate.name + " · candidate" : "Candidate");
      else if (c.kind === "admin_recruiter") name = (c.recruiter ? c.recruiter.name + " · recruiter" : "Recruiter");
      else name = (c.candidate ? c.candidate.name : "?") + " ↔ " + (c.recruiter ? c.recruiter.name : "?");
      var last = c.last_message ? c.last_message.body : "No message yet";
      return '<div class="conv" data-id="'+c.id+'">'+
        '<div class="avatar">'+esc(initials(name))+'</div>'+
        '<div class="conv-body"><b>'+esc(name)+'</b><small>'+esc(last)+'</small></div>'+
        (c.unread?'<span class="unread">'+c.unread+'</span>':'')+
      '</div>';
    }).join("") || '<p class="empty">No conversations.</p>';
  }catch(e){ toast(e.message); }
}
document.getElementById("convList").addEventListener("click", function(e){
  var c = e.target.closest("[data-id]");
  if (c) openConv(parseInt(c.dataset.id, 10));
});

async function openConv(id){
  var conv = state.convs.filter(function(c){return c.id===id;})[0];
  state.active = id; state.msgs = []; state.lastId = 0;
  document.getElementById("chatView").classList.add("on");
  document.getElementById("chatPeer").textContent = conv
    ? (conv.candidate ? conv.candidate.name : (conv.recruiter ? conv.recruiter.name : "?"))
    : "Chat";
  document.getElementById("chatSub").textContent = conv ? conv.kind.replace("_"," ") : "";
  await pollMsgs(true);
  api("/api/chat/conversations/" + id + "/read", { method:"POST", body:{} }).catch(function(){});
  state.timer = setInterval(function(){ pollMsgs(false); }, 4000);
}
document.getElementById("chatBack").onclick = function(){
  document.getElementById("chatView").classList.remove("on");
  clearInterval(state.timer); loadConvs();
};
document.getElementById("chatDelete").onclick = async function(){
  if (!state.active) return;
  if (!confirm("Delete this conversation for BOTH sides?")) return;
  try{
    await api("/api/admin/chat/conversations/" + state.active, { method:"DELETE" });
    toast("Conversation deleted for both parties.");
    document.getElementById("chatBack").click();
  }catch(e){ toast(e.message); }
};
document.getElementById("chatForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var input = document.getElementById("chatInput");
  var text = input.value.trim();
  if (!text || !state.active) return;
  input.value = "";
  try{
    var d = await api("/api/chat/conversations/" + state.active + "/messages", { method:"POST", body:{ body: text }});
    state.msgs.push(d.message); renderMsgs();
  }catch(ex){ toast(ex.message); }
});

async function pollMsgs(reset){
  if (!state.active) return;
  try{
    var q = (state.lastId && !reset) ? "?after=" + state.lastId : "";
    var d = await api("/api/chat/conversations/" + state.active + "/messages" + q);
    var msgs = d.messages || [];
    state.msgs = reset ? msgs : state.msgs.concat(msgs);
    if (msgs.length) state.lastId = msgs[msgs.length-1].id;
    renderMsgs();
  }catch(e){ if (reset) document.getElementById("chatMsgs").innerHTML = '<p class="empty">'+esc(e.message)+'</p>'; }
}
function renderMsgs(){
  var box = document.getElementById("chatMsgs");
  if (!state.msgs.length){ box.innerHTML = '<p class="empty">No messages.</p>'; return; }
  box.innerHTML = state.msgs.map(function(m){
    var mine = m.sender_role === "admin";
    return '<div class="msg '+(mine?"mine":"theirs")+'">'+esc(m.body)+
      '<span class="meta">'+esc(m.sender_role)+' · '+timeOf(m.created_at)+'</span>'+
      '<button class="delmsg" data-msg="'+m.id+'" title="Delete for both">×</button></div>';
  }).join("");
  box.scrollTop = box.scrollHeight;
}
document.getElementById("chatMsgs").addEventListener("click", async function(e){
  var b = e.target.closest("[data-msg]");
  if (!b) return;
  if (!confirm("Delete this message for BOTH sides?")) return;
  try{
    await api("/api/admin/chat/messages/" + b.dataset.msg, { method:"DELETE" });
    state.msgs = state.msgs.filter(function(m){ return String(m.id) !== b.dataset.msg; });
    renderMsgs();
    toast("Message deleted for both parties.");
  }catch(ex){ toast(ex.message); }
});

/* ---------------------------------------------------------- notifications */
async function loadNotifs(){
  try{
    var d = await api("/api/notifications");
    document.getElementById("notifList").innerHTML = (d.notifications||[]).map(function(n){
      return '<div class="card"><div class="row"><b>'+esc(n.title)+'</b>'+
        (n.read_at?'':'<span class="pill">new</span>')+'</div>'+
        '<p class="muted" style="margin:6px 0 0">'+esc(n.body||"")+'</p>'+
        '<p class="muted" style="margin:4px 0 0;font-size:11px">'+timeOf(n.created_at)+'</p></div>';
    }).join("") || '<p class="empty">No alerts.</p>';
  }catch(e){ toast(e.message); }
}

/* auto-enter when a session was stored by the app */
(function boot(){
  setTimeout(function(){
    if (window.JCAndroid && JCAndroid.toast) { /* bridge ready */ }
  }, 0);
})();
</script>
</body>
</html>
